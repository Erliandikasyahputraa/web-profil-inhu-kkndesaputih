<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Warm Paper Background -->
  <rect width="100" height="100" fill="#F2EFE9"/>
  
  <!-- AP Monogram in Dark Olive (#2A2F25) -->
  <g fill="#2A2F25">
    <!-- A -->
    <path d="M 35 70 L 45 25 L 55 25 L 65 70 L 52 70 L 50 55 L 38 55 L 35 70 Z M 48 45 L 45 45 L 42 45 Z" />
    <polygon points="39,52 49,52 45,32" />
    
    <!-- P -->
    <path d="M 50 25 L 75 25 C 85 25 85 45 75 45 L 60 45 L 60 70 L 50 70 Z M 60 35 L 60 35 L 70 35 C 75 35 75 25 70 25 L 60 25 Z" />
  </g>

  <!-- Clean Swiss Minimalist Monogram 'AP' -->
